name: 更新 IPTV 订阅

on:
  schedule:
    # 每 3 小时跑一次（cron 用 UTC，这里 00/03/06...UTC = 北京 08/11/14...）
    - cron: "0 */3 * * *"
  workflow_dispatch:          # 也可以在网页上手动点“Run workflow”
  push:
    branches: [ main ]
    paths:
      - "scripts/**"
      - "config.json"
      - ".github/workflows/update.yml"

permissions:
  contents: write             # 需要写权限才能把结果 commit 回仓库

concurrency:
  group: iptv-update
  cancel-in-progress: false

env:
  CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成订阅（抓源 → 实测 → 过滤 → 出 m3u）
        timeout-minutes: 40
        env:
          TZ: Asia/Shanghai
          PROBE_BUDGET: "1800"
        run: python scripts/fetch.py

      - name: 显示结果摘要
        run: |
          echo "### 本次结果" >> $GITHUB_STEP_SUMMARY
          python - <<'EOF' >> $GITHUB_STEP_SUMMARY
          import json
          r = json.load(open('output/report.json', encoding='utf-8'))
          print(f"- 时间：{r['updated']}")
          print(f"- 频道：{r['channels']} 个，可用源：{r['streams']} 条")
          print(f"- 实测：{r['probed']} 条，存活：{r['alive']} 条，AAC 音轨：{r['aac']} 条")
          print(f"- 剔除（全部源失效）：{len(r['dropped_channels'])} 个频道")
          print(f"- 耗时：{r['elapsed_sec']} 秒")
          EOF
          head -5 output/iptv.m3u

      - name: 提交结果回仓库
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          git -c rebase.autostash=true pull --rebase origin main
          git add output
          if git diff --cached --quiet; then
            echo "内容没有变化，跳过提交"
          else
            git commit -m "自动更新 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git push
          fi

      # 可选：如果你在 Cloudflare 里配了 CF_API_TOKEN / CF_ACCOUNT_ID，下面这步会自动推到 Pages
      - name: 部署到 Cloudflare Pages（可选）
        if: env.CF_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy output --project-name=iptv-sub
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
